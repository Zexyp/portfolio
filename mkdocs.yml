site_name: Zexyp
site_description: Technical Artist
site_url: https://zexyp.github.io/portfolio/

plugins:
  - blog:
      blog_dir: blog
  - blog:
      blog_dir: gallery
      categories: true
      archive_toc: true
      blog_toc: true
      pagination: false
  #- search


theme:
  favicon: assets/scalable/icon.svg
  logo: assets/scalable/logo.svg
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-6
        name: Turn on the lights
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Turn off the lights
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Let the system decide
  features:
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - toc.integrate

nav:
  - Gallery:
      - gallery/index.md
  - Blog:
      - blog/index.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/shrinky.css
  - stylesheets/glow.css
  - stylesheets/bs.css
  - stylesheets/md.css

extra:
  social:
    - icon: octicons/mark-github-16
      link: https://github.com/Zexyp/
    - icon: simple/blender
      link: https://extensions.blender.org/author/1824/
    - icon: simple/artstation
      link: https://www.artstation.com/zexyp
    - icon: simple/youtube
      link: https://www.youtube.com/@zexyp44

markdown_extensions:
  - attr_list
