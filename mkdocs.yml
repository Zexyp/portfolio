site_name: Zexyp

theme:
  favicon: assets/favicon.png
  logo: assets/logo.png
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-6
        name: Turn on the lights
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Turn off the lights
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-outline
        name: Let the system decide
  features:
    - navigation.tabs
    - navigation.path
    - navigation.top

nav:
  - Home: index.md
  - Gallery: .
  - Blog: .

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: octicons/mark-github-16
      link: https://github.com/Zexyp/
    - icon: simple/blender
      link: https://extensions.blender.org/author/1824/